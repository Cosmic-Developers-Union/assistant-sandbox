name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # B09:发布门禁——标签提交必须先通过 Test 工作流的全部任务
      # (light/integration/differential/s4/runtime);等待其完成,
      # 结论非 success 即拒绝发布。
      - name: Require Test workflow success for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            runs=$(gh api "repos/$GH_REPO/actions/workflows/test.yml/runs?head_sha=$sha" --jq '[.workflow_runs[] | select(.event != "pull_request")] | sort_by(.created_at) | last')
            status=$(printf '%s' "$runs" | jq -r '.status // "missing"')
            conclusion=$(printf '%s' "$runs" | jq -r '.conclusion // "pending"')
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "Test 工作流对该提交结论为 success,放行发布"
                exit 0
              fi
              echo "Test 工作流对该提交结论为 $conclusion,未通过目标提交验收,拒绝发布" >&2
              exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "等待 Test 工作流超时(60 分钟),拒绝发布" >&2
              exit 1
            fi
            echo "等待 Test 工作流完成(当前: ${status:-尚未注册})…"
            sleep 60
          done
      - name: Build release CLIs and SBOM
        shell: bash
        run: sh testdata/release/build-release.sh dist "${GITHUB_REF_NAME}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --draft
      - name: Download and verify release in an empty directory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          download="$RUNNER_TEMP/release-download"
          mkdir -p "$download"
          gh release download "$RELEASE_TAG" -D "$download"
          sh testdata/release/verify-download.sh "$download" "$RELEASE_TAG"
      - name: Verify downloaded default CLI through real PTY
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          download="$RUNNER_TEMP/release-download"
          mkdir -p "$RUNNER_TEMP/release-pty"
          docker run --rm --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$download":/download:ro \
            -v "$PWD/testdata/release":/scripts:ro \
            -v "$RUNNER_TEMP/release-pty":/out \
            python:3.12.16-slim-bookworm@sha256:44cf1793efa7c7a476bb0f2cff81443f4a072c90c1cb127e2924933daa3e8c64 \
            sh -c 'PATH=/nonexistent /usr/local/bin/python3 /scripts/pty-node-check.py /download/assistant-sandbox-linux-amd64 /out/native-x11.pty.log --expect-backend linux/amd64 --expect-arch x64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-download-verification
          path: ${{ runner.temp }}/release-pty/
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
