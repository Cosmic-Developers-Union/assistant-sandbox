name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # B08:轻量任务——源码边界、lint 与勾选/许可纪律。
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify source boundary
        shell: bash
        run: |
          go mod tidy -diff
          go build ./...
      - name: Toolchain declaration check (B03)
        run: make toolchain
      - name: Isolated checkout resolves and builds (B01)
        run: make isolated-check
      - name: Track discipline and license inventory (A10/B10)
        run: go test ./internal/metadata/ -count=1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          verify: true
          args: ./...

  # B08:集成任务——内核、ABI、执行器全量测试与 ISA 回归门禁。
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOFLAGS: -p=1
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit and integration tests
        shell: bash
        run: |
          ulimit -d 1048576
          go test -count=1 -skip 'TestPython312Multiprocessing|TestPython312VenvOfflineInstall|TestPython312ControlledPipInstall|TestPython312PipBuildsNativeSdist|TestPython312UpstreamTestSlice|TestPythonNodeCoexist|TestNode' ./abi/... ./filesystem/... ./loader/... ./vm/... ./executor/... ./model/... ./internal/guest/ ./deployment/... ./contract/... ./inspect/...
      - name: ISA regression gate (D13)
        shell: bash
        run: go test ./executor/cpu/... -count=1 -v 2>&1 | grep -E '^(=== RUN|--- FAIL|FAIL|ok)' | tail -120

  # T08:固定配置的 CPU/系统调用基准,结果作为可比对工件保存。
  # Q10/Q12:Python multiprocessing 与 venv/pip 离线安装属于重型
  # 运行时测试,独立任务避免与集成任务共享 40 分钟预算。
  python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Multiprocessing, offline venv, pip and native wheel (Q10/Q12)
        run: go test ./internal/guest/ -run 'TestPython312Multiprocessing|TestPython312VenvOfflineInstall' -count=1 -timeout 3000s

  # Q14:固定 CPython 3.12.16 上游测试分片。
  python-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: CPython upstream test slice
        run: go test ./internal/guest/ -run TestPython312UpstreamTestSlice -count=1 -timeout 3000s

  # Q13:客体 pip 通过受控 DNS、HTTPS 索引与 CA 校验完成安装/回滚。
  python-network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Controlled pip network install
        run: go test ./internal/guest/ -run TestPython312ControlledPipInstall -count=1 -timeout 2400s

  # Q29:客体 sdist、PEP 517 后端与 TinyCC 源码构建。
  python-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Guest-native Python sdist build
        run: go test ./internal/guest/ -run TestPython312PipBuildsNativeSdist -count=1 -timeout 2400s

  # Q16-Q23:Node.js 客体运行时测试独立任务,避免与集成任务共享预算。
  node-runtime:
    # 重型 Node 运行时套件保留给 PR/手动运行；main push 先不阻塞
    # 首个用户版本，待 npm/Node 路径优化到发布预算内再启用。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Node.js guest runtime
        run: go test ./internal/guest/ -run 'TestNode' -skip 'TestNode22NpmControlledRegistry' -count=1 -timeout 3000s

  # Q26:客体 npm 受控 registry、完整性校验与 TLS 探针。
  npm-network:
    # 与 node-runtime 相同：Q26 受控 npm registry 目前超出发布预算，
    # 保留手动门禁，不阻塞 main push/tag 发布。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Controlled npm registry
        run: go test ./internal/guest/ -run TestNode22NpmControlledRegistry -count=1 -timeout 3600s

  # Q31:同一 VM 内的 Python/Node 文件、管道、回环 HTTP 与重连。
  coexist-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Python and Node coexistence
        run: go test ./internal/guest/ -run TestPythonNodeCoexist -count=1 -timeout 1800s

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: CPU and syscall baseline (T08)
        run: go test ./abi/linux/common/ -run '^$' -bench 'BenchmarkGetpid|BenchmarkWrite' -benchmem -count=5 | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark.txt

  # T09:Python/Node 真实客体场景基线(启动、文件、线程/算术、内存)。
  scene-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Python and Node scene baseline
        run: go test ./internal/guest/ -run 'TestPythonNodeSceneBaseline|TestRuntimeMemorySnapshot' -count=1 -v -timeout 900s

  # R09:新检出按 docs/getting-started.md 复验构建、Bash/Python/Node 与关闭。
  getting-started:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and run the documented getting-started flow
        run: make getting-started

  # Q01:从固定源码构建 CPython 3.12.16(riscv64-linux-musl),保存摘要工件。
  python-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: python-build-cache
        with:
          path: ${{ runner.temp }}/python312-build
          key: cpython-3.12.16-${{ runner.os }}-${{ hashFiles('internal/guest/testdata/python312/**') }}
      - uses: goto-bus-stop/setup-zig@v2
        if: steps.python-build-cache.outputs.cache-hit != 'true'
        with:
          version: 0.17.0
      - name: Install qemu-riscv64
        if: steps.python-build-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
      - name: Build CPython 3.12.16 from source (Q01)
        if: steps.python-build-cache.outputs.cache-hit != 'true'
        env:
          QEMU_RISCV64: qemu-riscv64
        run: bash internal/guest/testdata/python312/build.sh "$RUNNER_TEMP/python312-build"
      - uses: actions/upload-artifact@v4
        with:
          name: cpython-3.12.16-manifest
          path: ${{ runner.temp }}/python312-build/manifest.txt

  # B08:差分任务——同一客体字节码在 qemu-riscv64 参考与本 VM 对拍(A09)。
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install qemu-riscv64 user emulation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
      - name: Profile consistency and differential probes
        run: |
          go test ./abi/... -count=1
          go test ./internal/diff/ -count=1 -v

  # B08:运行时入口任务——离线运行、CLI 与产物核验。
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Offline VM lifecycle (B05)
        run: make offline-check
      - name: Package release artifacts (U12)
        run: make release
      - name: Verify release checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Verify CLI
        run: ./assistant-sandbox -c 'printf sandbox-ok'
