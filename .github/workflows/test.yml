name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # B08:轻量任务——源码边界、lint、构建器可重复性与勾选/许可纪律。
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify source boundary
        shell: bash
        run: |
          test -z "$(git ls-files -- assistant-bash.wasm assistant-bash.wasm.gz)"
          go mod tidy -diff
          go build ./...
      - name: Toolchain declaration check (B03)
        run: make toolchain
      - name: Isolated checkout resolves and builds (B01)
        run: make isolated-check
      - name: Track discipline and license inventory (A10/B10)
        run: go test ./internal/metadata/ -count=1
      - name: Reproducible guest build (B06)
        run: go test ./internal/build/ -count=1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          verify: true
          args: ./...

  # B08:集成任务——内核、ABI、执行器全量测试与 ISA 回归门禁。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build WASI guest
        run: make guest
      - name: Unit and integration tests
        shell: bash
        run: |
          ulimit -d 1048576
          go test -count=1 ./abi/... ./filesystem/... ./loader/... ./vm/... ./executor/... ./model/... ./internal/guest/ ./deployment/... ./contract/... ./inspect/...
      - name: ISA regression gate (D13)
        shell: bash
        run: go test ./executor/cpu/... -count=1 -v 2>&1 | grep -E '^(=== RUN|--- FAIL|FAIL|ok)' | tail -120

  # T08:固定配置的 CPU/系统调用基准,结果作为可比对工件保存。
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: CPU and syscall baseline (T08)
        run: go test ./abi/linux/common/ -run '^$' -bench 'BenchmarkGetpid|BenchmarkWrite' -benchmem -count=5 | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark.txt

  # Q01:从固定源码构建 CPython 3.12.16(riscv64-linux-musl),保存摘要工件。
  python-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install qemu-riscv64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - name: Build CPython 3.12.16 from source (Q01)
        run: bash internal/guest/testdata/python312/build.sh "$RUNNER_TEMP/python312-build"
      - uses: actions/upload-artifact@v4
        with:
          name: cpython-3.12.16-manifest
          path: ${{ runner.temp }}/python312-build/manifest.txt

  # B08:差分任务——同一客体字节码在 qemu-riscv64 参考与本 VM 对拍(A09)。
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install qemu-riscv64 user emulation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - name: Profile consistency and differential probes
        run: |
          go test ./abi/... -count=1
          go test ./internal/diff/ -count=1 -v

  # B08:POSIX 开发检查。
  posix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: POSIX development checks
        run: make -C test/posix gate

  # B08:运行时入口任务——离线运行、CLI 与产物核验。
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 768MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Offline VM lifecycle (B05)
        run: make offline-check
      - name: Build CLI
        run: go build -trimpath -o assistant-sandbox ./cmd/assistant-sandbox
      - name: Verify CLI
        run: ./assistant-sandbox --module assistant-bash.wasm.gz -c 'printf sandbox-ok'
